# Private graders for `vgi-lint simulate` (VGI416). The worker publishes only
# task names and prompts in vgi.agent_test_tasks (vgi_scikit_bio/worker.py);
# these canonical solutions stay in the repo and are merged by task name.
tasks:
- name: gc_content
  reference_sql: SELECT skbio.sequence.gc_content('ATGCGGATTACAGG') AS gc
- name: gc_and_motif_counts
  reference_sql: SELECT skbio.sequence.gc_frequency('ATGCGATGCATG') AS gc_bases, skbio.sequence.count_subsequence('ATGCGATGCATG', 'ATG') AS start_codons
- name: reverse_complement
  reference_sql: SELECT skbio.sequence.reverse_complement('ATGCGGATTACAGG') AS rc
- name: strand_relationship
  reference_sql: SELECT ('ATGC' = 'GCAT') AS same_strand, skbio.sequence.is_reverse_complement('ATGC', 'GCAT') AS opposite_strand
- name: transcription_round_trip
  reference_sql: SELECT skbio.sequence.complement('ATGCGGATTACAGG') AS comp, skbio.sequence.transcribe('ATGCGGATTACAGG') AS rna, skbio.sequence.reverse_transcribe(skbio.sequence.transcribe('ATGCGGATTACAGG')) AS back_to_dna
- name: translate
  reference_sql: SELECT skbio.sequence.translate('ATGCGGATTACAGGT') AS protein
- name: sequence_quality_flags
  reference_sql: SELECT skbio.sequence.is_valid_dna('AC-GTN') AS valid_dna, skbio.sequence.is_valid_protein('AC-GTN') AS valid_protein, skbio.sequence.has_gaps('AC-GTN') AS gapped, skbio.sequence.has_degenerates('AC-GTN') AS ambiguous, skbio.sequence.degap('AC-GTN') AS ungapped
- name: read_vs_reference
  reference_sql: SELECT skbio.sequence.match_count('ACGTACGT', 'ACGAACGT') AS matches, skbio.sequence.mismatch_count('ACGTACGT', 'ACGAACGT') AS mismatches, round(skbio.sequence.hamming_distance('ACGTACGT', 'ACGAACGT'), 4) AS hamming
- name: kmer_count
  reference_sql: SELECT count(*) AS n FROM skbio.sequence.kmer_frequencies((SELECT * FROM (VALUES (1, 'ATGCGGATTACAGG')) AS r(id, seq)), id := 'id', k := 3)
- name: base_composition
  reference_sql: SELECT residue, count FROM skbio.sequence.residue_frequencies((SELECT * FROM (VALUES ('ATGCGGATTACAGG')) AS r(seq))) ORDER BY residue
- name: six_frame_translation
  reference_sql: SELECT frame, protein FROM skbio.sequence.translate_six_frames((SELECT * FROM (VALUES ('ATGCGGATTACAGG')) AS r(seq))) ORDER BY frame
- name: alignment_score
  reference_sql: SELECT skbio.alignment.align_score_nucleotide('ACTGGT', 'ACTGT') AS score
- name: protein_alignment_score
  reference_sql: SELECT skbio.alignment.align_score_protein('MRITMK', 'MRIMK') AS score
- name: pairwise_dna_alignment
  reference_sql: SELECT aligned_1, aligned_2, score FROM skbio.alignment.pairwise_align_nucleotide((SELECT * FROM (VALUES ('ACTGGT', 'ACTGT')) AS p(ref, read)))
- name: pairwise_protein_alignment
  reference_sql: SELECT aligned_1, aligned_2, score FROM skbio.alignment.pairwise_align_protein((SELECT * FROM (VALUES ('MRITMK', 'MRIMK')) AS p(ref, query)))
- name: alpha_diversity
  reference_sql: SELECT sample_id, round(skbio.diversity.shannon(count), 4) AS shannon FROM (VALUES (1,'a',4),(1,'b',2),(2,'a',1),(2,'b',9)) AS t(sample_id, feature_id, count) GROUP BY sample_id ORDER BY sample_id
- name: observed_richness
  reference_sql: SELECT skbio.diversity.observed_features(count)::BIGINT AS richness FROM (VALUES (1,'a',4),(1,'b',0),(1,'c',3)) AS t(sample_id, feature_id, count)
- name: richness_estimators
  reference_sql: SELECT round(skbio.diversity.chao1(count), 4) AS chao1, round(skbio.diversity.ace(count), 4) AS ace, round(skbio.diversity.singles(count), 4) AS singletons, round(skbio.diversity.doubles(count), 4) AS doubletons, round(skbio.diversity.chao1_ci(count)[1], 4) AS chao1_lower, round(skbio.diversity.chao1_ci(count)[2], 4) AS chao1_upper FROM (VALUES ('a',4),('b',2),('c',1),('d',1),('e',3),('f',7)) AS t(feature_id, count)
- name: observed_singles_doubles_triple
  reference_sql: SELECT skbio.diversity.osd(count)[1] AS observed, skbio.diversity.osd(count)[2] AS singletons, skbio.diversity.osd(count)[3] AS doubletons FROM (VALUES ('a',4),('b',2),('c',1),('d',1),('e',3),('f',7)) AS t(feature_id, count)
- name: evenness_metrics
  reference_sql: SELECT round(skbio.diversity.pielou_evenness(count), 4) AS pielou, round(skbio.diversity.heip_evenness(count), 4) AS heip, round(skbio.diversity.simpson_e(count), 4) AS simpson_e, round(skbio.diversity.mcintosh_e(count), 4) AS mcintosh_e, round(skbio.diversity.gini_index(count), 4) AS gini FROM (VALUES ('a',4),('b',2),('c',1),('d',1),('e',3),('f',7)) AS t(feature_id, count)
- name: dominance_metrics
  reference_sql: SELECT round(skbio.diversity.dominance(count), 4) AS dominance, round(skbio.diversity.simpson(count), 4) AS simpson, round(skbio.diversity.simpson_d(count), 4) AS simpson_d, round(skbio.diversity.inv_simpson(count), 4) AS inv_simpson, round(skbio.diversity.enspie(count), 4) AS enspie, round(skbio.diversity.berger_parker_d(count), 4) AS berger_parker FROM (VALUES ('a',4),('b',2),('c',1),('d',1),('e',3),('f',7)) AS t(feature_id, count)
- name: mcintosh_and_strong_dominance
  reference_sql: SELECT round(skbio.diversity.mcintosh_d(count), 4) AS mcintosh_d, round(skbio.diversity.strong(count), 4) AS strong FROM (VALUES ('a',4),('b',2),('c',1),('d',1),('e',3),('f',7)) AS t(feature_id, count)
- name: entropy_metrics
  reference_sql: SELECT round(skbio.diversity.shannon(count), 4) AS shannon, round(skbio.diversity.brillouin_d(count), 4) AS brillouin FROM (VALUES ('a',4),('b',2),('c',1),('d',1),('e',3),('f',7)) AS t(feature_id, count)
- name: diversity_orders
  reference_sql: SELECT round(skbio.diversity.hill(count, 2), 4) AS hill, round(skbio.diversity.renyi(count, 2), 4) AS renyi, round(skbio.diversity.tsallis(count, 2), 4) AS tsallis FROM (VALUES ('a',4),('b',2),('c',1),('d',1),('e',3),('f',7)) AS t(feature_id, count)
- name: richness_indices
  reference_sql: SELECT round(skbio.diversity.margalef(count), 4) AS margalef, round(skbio.diversity.menhinick(count), 4) AS menhinick, round(skbio.diversity.fisher_alpha(count), 4) AS fisher_alpha, round(skbio.diversity.kempton_taylor_q(count), 4) AS kempton_taylor FROM (VALUES ('a',4),('b',2),('c',1),('d',1),('e',3),('f',7)) AS t(feature_id, count)
- name: coverage_metrics
  reference_sql: SELECT round(skbio.diversity.goods_coverage(count), 4) AS goods_coverage, round(skbio.diversity.robbins(count), 4) AS robbins, round(skbio.diversity.esty_ci(count)[1], 4) AS esty_lower, round(skbio.diversity.esty_ci(count)[2], 4) AS esty_upper FROM (VALUES ('a',4),('b',2),('c',1),('d',1),('e',3),('f',7)) AS t(feature_id, count)
- name: beta_matrix_size
  reference_sql: SELECT count(*) AS n FROM skbio.diversity.beta_diversity((SELECT * FROM (VALUES ('s1','a',4),('s1','b',1),('s2','a',3),('s2','b',2),('s3','a',0),('s3','b',9)) AS t(sample_id, feature_id, count)))
- name: faith_pd
  reference_sql: SELECT sample_id, round(faith_pd, 4) AS faith_pd FROM skbio.diversity.faith_pd((SELECT * FROM (VALUES ('s1','f1',1),('s1','f2',1),('s2','f3',1),('s2','f4',1),('s3','f1',1),('s3','f3',1)) AS t(sample_id, feature_id, count)), tree := '((f1:0.1,f2:0.2):0.3,(f3:0.15,f4:0.25):0.35);') ORDER BY sample_id
- name: unifrac_distances
  reference_sql: SELECT id_1, id_2, round(distance, 4) AS distance FROM skbio.diversity.unifrac((SELECT * FROM (VALUES ('s1','f1',1),('s1','f2',1),('s2','f3',1),('s2','f4',1),('s3','f1',1),('s3','f3',1)) AS t(sample_id, feature_id, count)), tree := '((f1:0.1,f2:0.2):0.3,(f3:0.15,f4:0.25):0.35);') WHERE id_1 < id_2 ORDER BY id_1, id_2
- name: rarefaction
  reference_sql: SELECT sample_id, feature_id, count FROM skbio.diversity.subsample_counts((SELECT * FROM (VALUES ('s1','a',4),('s1','b',2),('s1','c',6),('s2','a',10),('s2','b',5),('s2','c',5)) AS t(sample_id, feature_id, count)), depth := 8) ORDER BY sample_id, feature_id
- name: phylogenetic_vs_observed_richness
  reference_sql: WITH ft AS (SELECT * FROM (VALUES ('s1','f1',3),('s1','f2',5),('s2','f1',2),('s2','f4',6),('s3','f2',1),('s3','f3',1),('s3','f4',2)) AS t(sample_id, feature_id, count)) SELECT p.sample_id, r.richness, round(p.faith_pd, 4) AS faith_pd FROM skbio.diversity.faith_pd((SELECT * FROM ft), tree := '((f1:0.1,f2:0.2):0.3,(f3:0.15,f4:0.25):0.35);') AS p JOIN (SELECT sample_id, skbio.diversity.observed_features(count)::BIGINT AS richness FROM ft GROUP BY sample_id) AS r USING (sample_id) ORDER BY p.sample_id
- name: rarefied_bray_curtis
  reference_sql: SELECT id_1, id_2, round(distance, 4) AS distance FROM skbio.diversity.beta_diversity((SELECT * FROM skbio.diversity.subsample_counts((SELECT * FROM (VALUES ('s1','a',30),('s1','b',10),('s1','c',2),('s2','a',300),('s2','b',120),('s2','c',60),('s3','a',5),('s3','b',40),('s3','c',20)) AS t(sample_id, feature_id, count)), depth := 40)), metric := 'braycurtis') WHERE id_1 < id_2 ORDER BY id_1, id_2
- name: pcoa_embedding
  reference_sql: SELECT sample_id, round(pc_1, 4) AS pc_1 FROM skbio.stats.pcoa((SELECT * FROM skbio.diversity.beta_diversity((SELECT * FROM (VALUES ('s1','a',4),('s1','b',2),('s1','c',1),('s2','a',1),('s2','b',9),('s2','c',2)) AS t(sample_id, feature_id, count)))), n_components := 2) ORDER BY sample_id
- name: pca_scores
  reference_sql: SELECT sample_id, round(pc_1, 4) AS pc_1 FROM skbio.stats.pca((SELECT * FROM (VALUES ('s1','a',4),('s1','b',2),('s1','c',1),('s2','a',1),('s2','b',9),('s2','c',2)) AS t(sample_id, feature_id, count)), n_components := 2) ORDER BY sample_id
- name: correspondence_analysis
  reference_sql: SELECT sample_id, round(ca_1, 4) AS ca_1 FROM skbio.stats.ca((SELECT * FROM (VALUES ('s1','a',4),('s1','b',2),('s1','c',1),('s2','a',1),('s2','b',9),('s2','c',2)) AS t(sample_id, feature_id, count)), n_components := 2) ORDER BY sample_id
- name: permanova_statistic
  reference_sql: SELECT round(test_statistic, 4) AS pseudo_f, number_of_groups AS n_groups FROM skbio.stats.permanova((SELECT b.id_1, b.id_2, b.distance, g.grp FROM skbio.diversity.beta_diversity((SELECT * FROM (VALUES ('s1','a',4),('s1','b',1),('s2','a',3),('s2','b',2),('s3','a',1),('s3','b',8),('s4','a',0),('s4','b',9)) AS t(sample_id, feature_id, count))) AS b JOIN (VALUES ('s1','x'),('s2','x'),('s3','y'),('s4','y')) AS g(sample, grp) ON b.id_1 = g.sample))
- name: anosim_statistic
  reference_sql: SELECT round(test_statistic, 4) AS r_statistic, sample_size FROM skbio.stats.anosim((SELECT b.id_1, b.id_2, b.distance, g.grp FROM skbio.diversity.beta_diversity((SELECT * FROM (VALUES ('s1','a',4),('s1','b',1),('s2','a',3),('s2','b',2),('s3','a',1),('s3','b',8),('s4','a',0),('s4','b',9)) AS t(sample_id, feature_id, count))) AS b JOIN (VALUES ('s1','x'),('s2','x'),('s3','y'),('s4','y')) AS g(sample, grp) ON b.id_1 = g.sample))
- name: mantel_correlation
  reference_sql: SELECT round(correlation, 4) AS correlation, n FROM skbio.stats.mantel((SELECT * FROM (VALUES ('a','b',0.5,0.4),('a','c',0.7,0.9),('b','c',0.6,0.5)) AS d(id_1, id_2, distance_x, distance_y)))
- name: clr_round_trip
  reference_sql: SELECT sample_id, feature, round(value, 4) AS value FROM skbio.stats.clr_inv((SELECT * FROM skbio.stats.clr((SELECT * FROM (VALUES ('s1','a',1),('s1','b',2),('s1','c',3),('s2','a',4),('s2','b',5),('s2','c',6)) AS t(sample_id, feature_id, value))))) ORDER BY sample_id, feature
- name: ilr_round_trip
  reference_sql: SELECT sample_id, feature, round(value, 4) AS value FROM skbio.stats.ilr_inv((SELECT * FROM skbio.stats.ilr((SELECT * FROM (VALUES ('s1','a',1),('s1','b',2),('s1','c',3),('s2','a',4),('s2','b',5),('s2','c',6)) AS t(sample_id, feature_id, value))))) ORDER BY sample_id, feature
- name: alr_round_trip
  reference_sql: SELECT sample_id, feature, round(value, 4) AS value FROM skbio.stats.alr_inv((SELECT * FROM skbio.stats.alr((SELECT * FROM (VALUES ('s1','a',1),('s1','b',2),('s1','c',3),('s2','a',4),('s2','b',5),('s2','c',6)) AS t(sample_id, feature_id, value))))) ORDER BY sample_id, feature
- name: normalise_composition
  reference_sql: SELECT sample_id, feature_id, round(proportion, 4) AS proportion FROM skbio.stats.closure((SELECT * FROM (VALUES ('s1','a',1),('s1','b',2),('s1','c',3),('s2','a',4),('s2','b',5),('s2','c',6)) AS t(sample_id, feature_id, value))) ORDER BY sample_id, feature_id
- name: centre_composition
  reference_sql: SELECT sample_id, feature_id, round(centered, 4) AS centered FROM skbio.stats.centralize((SELECT * FROM (VALUES ('s1','a',1),('s1','b',2),('s1','c',3),('s2','a',4),('s2','b',5),('s2','c',6)) AS t(sample_id, feature_id, value))) ORDER BY sample_id, feature_id
- name: sparse_composition_handling
  reference_sql: SELECT sample_id, feature_id, round(value, 4) AS value FROM skbio.stats.multi_replace((SELECT * FROM (VALUES ('s1','a',0),('s1','b',2),('s1','c',3),('s2','a',4),('s2','b',0),('s2','c',6)) AS t(sample_id, feature_id, value))) ORDER BY sample_id, feature_id
- name: robust_clr
  reference_sql: SELECT sample_id, feature_id, round(rclr, 4) AS rclr FROM skbio.stats.rclr((SELECT * FROM (VALUES ('s1','a',0),('s1','b',2),('s1','c',3),('s2','a',4),('s2','b',0),('s2','c',6)) AS t(sample_id, feature_id, value))) ORDER BY sample_id, feature_id
- name: power_transform
  reference_sql: SELECT sample_id, feature_id, round(value, 4) AS value FROM skbio.stats.power((SELECT * FROM (VALUES ('s1','a',1),('s1','b',2),('s1','c',3),('s2','a',4),('s2','b',5),('s2','c',6)) AS t(sample_id, feature_id, value)), power := 2.0) ORDER BY sample_id, feature_id
- name: feature_association
  reference_sql: SELECT feature_1, feature_2, round(vlr, 4) AS vlr FROM skbio.stats.pairwise_vlr((SELECT * FROM (VALUES ('s1','a',1),('s1','b',2),('s1','c',3),('s2','a',4),('s2','b',5),('s2','c',6),('s3','a',2),('s3','b',1),('s3','c',7)) AS t(sample_id, feature_id, value))) WHERE feature_1 < feature_2 ORDER BY feature_1, feature_2
- name: ancom_differential_abundance
  reference_sql: SELECT feature_id, w, significant FROM skbio.stats.ancom((SELECT s.sample_id, s.feature_id, s.count, g.grp FROM (VALUES ('s1','b1',12),('s1','b2',11),('s2','b1',9),('s2','b2',11),('s3','b1',1),('s3','b2',11),('s4','b1',22),('s4','b2',21),('s5','b1',20),('s5','b2',22),('s6','b1',23),('s6','b2',21)) AS s(sample_id, feature_id, count) JOIN (VALUES ('s1','x'),('s2','x'),('s3','x'),('s4','y'),('s5','y'),('s6','y')) AS g(sample, grp) ON s.sample_id = g.sample)) ORDER BY feature_id
- name: dirmult_differential_abundance
  reference_sql: SELECT feature_id, round(log2_fold_change, 4) AS log2_fold_change, significant FROM skbio.stats.dirmult_ttest((SELECT s.sample_id, s.feature_id, s.count, g.grp FROM (VALUES ('s1','b1',12),('s1','b2',11),('s2','b1',9),('s2','b2',11),('s3','b1',1),('s3','b2',11),('s4','b1',22),('s4','b2',21),('s5','b1',20),('s5','b2',22),('s6','b1',23),('s6','b2',21)) AS s(sample_id, feature_id, count) JOIN (VALUES ('s1','x'),('s2','x'),('s3','x'),('s4','y'),('s5','y'),('s6','y')) AS g(sample, grp) ON s.sample_id = g.sample)) ORDER BY feature_id
- name: tree_tip_count
  reference_sql: SELECT skbio.tree.tip_count('((a:2,b:3):3,d:4,c:4);') AS tips
- name: neighbor_joining_tree
  reference_sql: SELECT newick, skbio.tree.tip_count(newick) AS tips FROM skbio.tree.neighbor_joining((SELECT * FROM (VALUES ('a','b',5),('a','c',9),('a','d',9),('b','c',10),('b','d',10),('c','d',8)) AS d(id_1, id_2, distance)))
- name: upgma_tree_shape
  reference_sql: SELECT round(skbio.tree.total_branch_length(newick), 4) AS total_length, round(skbio.tree.tree_height(newick), 4) AS height FROM skbio.tree.upgma((SELECT * FROM (VALUES ('a','b',5),('a','c',9),('a','d',9),('b','c',10),('b','d',10),('c','d',8)) AS d(id_1, id_2, distance)))
- name: minimum_evolution_topologies_agree
  reference_sql: SELECT skbio.tree.robinson_foulds(g.newick, b.newick) AS rf_distance FROM skbio.tree.gme((SELECT * FROM (VALUES ('a','b',5),('a','c',9),('a','d',9),('b','c',10),('b','d',10),('c','d',8)) AS d(id_1, id_2, distance))) AS g, skbio.tree.bme((SELECT * FROM (VALUES ('a','b',5),('a','c',9),('a','d',9),('b','c',10),('b','d',10),('c','d',8)) AS d(id_1, id_2, distance))) AS b
- name: branch_length_aware_tree_comparison
  reference_sql: SELECT round(skbio.tree.weighted_robinson_foulds('((a:1,b:1):1,(c:1,d:1):1);', '((a:1,c:1):5,(b:1,d:1):5);'), 4) AS wrf, round(skbio.tree.cophenetic_distance('((a:1,b:1):1,(c:1,d:1):1);', '((a:1,c:1):5,(b:1,d:1):5);'), 4) AS cophenetic
